<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Nokta · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--gold:#f2c14e;--gold2:#b8841f;--line:#1d1810;--mute:#8d8878;--silver:#f1f3f7;--red:#ff5d5d}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--silver);font-family:'Jost',system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 14px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.logo{font-weight:300;letter-spacing:.3em;font-size:22px;margin-right:-.3em}
h2{font-family:'Bebas Neue';font-weight:400;font-size:30px;letter-spacing:.03em;color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 16px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#140e02}
.ghost{background:none;border:1px solid var(--line);color:var(--silver);font-weight:500}
.danger{background:none;border:1px solid #4a1d1d;color:var(--red)}
input,select{width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid #2a2212;background:#0a0a0a;color:var(--silver);font:inherit;font-size:16px}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px;text-align:center}
.login .logo{font-size:34px}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#070707}
.row.off{opacity:.45}
.th{width:52px;height:62px;border-radius:8px;object-fit:cover;background:#1a1306;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';color:var(--gold);font-size:24px}
.row .n{flex:1;min-width:0;line-height:1.25}
.row .n b{display:block;font-weight:500;font-size:15px}
.row .n small{color:var(--mute);font-size:13px}
.row .n em{font-style:normal;color:var(--gold);font-family:'Bebas Neue';font-size:20px;letter-spacing:.03em}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;max-height:94vh;max-height:94dvh;overflow:auto;overscroll-behavior:contain;background:#000;border:1px solid #2a2212;border-bottom:0;border-radius:22px 22px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:none;gap:14px}
.on{display:grid}.veil.on{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:12px;align-items:center}
.pick img,.pick .th{width:80px;height:96px}
.pick .col{display:grid;gap:8px;flex:1}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--silver);font-size:15px}
.chk input{width:24px;min-height:24px;height:24px;accent-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#111;border:1px solid var(--gold2);padding:12px 18px;border-radius:12px;z-index:90;font-size:14px;display:none;max-width:90vw}
.err{color:var(--red);font-size:14px;min-height:18px}
.hint{color:var(--mute);font-size:13px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;background:#070707}
.stat b{display:block;font-family:'Bebas Neue';font-weight:400;font-size:26px;color:var(--gold);line-height:1}
.stat small{color:var(--mute);font-size:11px}
.tools{position:sticky;top:0;z-index:5;background:#000;padding:6px 0 10px;display:grid;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-size:13px}
.chip[aria-pressed=true]{background:var(--gold);color:#140e02;border-color:var(--gold);font-weight:600}
.row{padding:8px}
.row .main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left}
.side{display:flex;align-items:center;gap:6px;flex:none}
.sw{width:46px;height:28px;border-radius:99px;background:#2a2212;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8d8878;transition:transform .2s,background .2s}
.sw.on{background:var(--gold2)}.sw.on::after{transform:translateX(18px);background:#fff}
.mv{display:grid;gap:2px}
.mv button{width:34px;height:26px;border-radius:7px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.mv button:disabled{opacity:.25}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.live i{width:8px;height:8px;border-radius:50%;background:#555}.live.ok i{background:#4cd97b;box-shadow:0 0 8px #4cd97b}
.bar{height:4px;border-radius:4px;background:#1d1810;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
</style>
</head>
<body>
<div class="wrap">
<section id="vLogin" class="login" hidden>
  <div class="logo">NOKTA</div><h2>Panel admin</h2>
  <label>Correo<input id="em" type="email" autocomplete="username" inputmode="email"></label>
  <label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="err" id="lerr"></div>
  <button class="btn" id="go">Entrar</button>
</section>

<section id="vApp" hidden>
  <div class="top"><div><div class="logo">NOKTA</div><h2>Productos</h2><span class="live" id="live"><i></i><span>conectando…</span></span></div>
    <div style="display:flex;gap:8px"><button class="btn" id="new">Nuevo</button><button class="btn ghost" id="out">Salir</button></div></div>
  <div class="stats"><div class="stat"><b id="s1">0</b><small>Productos</small></div><div class="stat"><b id="s2">0</b><small>Visibles</small></div><div class="stat"><b id="s3">0</b><small>Ocultos</small></div><div class="stat"><b id="s4">0</b><small>Sin foto</small></div></div>
  <div class="tools"><input id="q" type="search" placeholder="Buscar producto…" autocomplete="off"><div class="chips" id="chips"></div></div>
  <p class="hint" style="margin-bottom:12px">Toca un producto para editarlo, el interruptor para mostrarlo u ocultarlo en el catálogo y las flechas para cambiar el orden. Todo se actualiza en vivo.</p>
  <div class="list" id="list"></div>
</section>
</div>

<div class="veil" id="veil"></div>
<form class="sheet" id="sh" onsubmit="return false">
  <h2 id="sht">Producto</h2>
  <div class="pick">
    <div id="prev" class="th">+</div>
    <div class="col">
      <input id="file" type="file" accept="image/*" hidden>
      <button type="button" class="btn ghost" id="pickBtn">Elegir foto</button>
      <button type="button" class="btn ghost" id="noImg">Quitar foto</button>
    </div>
  </div>
  <div class="bar" id="pb"><i></i></div>
  <label>Nombre<input id="fn" required></label>
  <div class="two">
    <label>Precio (COP)<input id="fp" type="number" inputmode="numeric" min="0" step="500"></label>
    <label>Orden<input id="fo" type="number" inputmode="numeric"></label>
  </div>
  <label>Categoría<input id="fc" list="cats" autocomplete="off"><datalist id="cats"></datalist></label>
  <label class="chk"><input id="fa" type="checkbox">Visible en el catálogo</label>
  <div class="err" id="ferr"></div>
  <button class="btn" id="save">Guardar</button>
  <div class="two"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button type="button" class="btn ghost" id="dup">Duplicar</button></div>
  <button type="button" class="btn danger" id="del">Eliminar</button>
</form>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL="https://urymseuacndizpztmaxa.supabase.co";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyeW1zZXVhY25kaXpwenRtYXhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTAyMDYsImV4cCI6MjEwOTA4NjIwNn0.FYgkSqUPlMVjSybGMS-ec1oeJCl8WDaMs7fx2fjv8mw";
var CLOUD_NAME="roqwoww1",UPLOAD_PRESET="Prestige"; // mismo Cloudinary de Prestige Lab
var $=function(s){return document.getElementById(s)};
var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var rows=[],cur=null,imgUrl=null,newFile=null,fcat="Todas",term="",chan=null,tm=null;
function money(n){return "$ "+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function toast(s){var t=$("toast");t.textContent=s;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},2600)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}

function show(on){$("vLogin").hidden=on;$("vApp").hidden=!on}
function enter(){show(true);load();live()}
db.auth.getSession().then(function(r){if(r.data.session)enter();else show(false)});
$("go").onclick=function(){
  $("lerr").textContent="";
  db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value}).then(function(r){
    if(r.error){$("lerr").textContent="Correo o contraseña incorrectos.";return}
    enter()});
};
$("pw").onkeydown=function(e){if(e.key=="Enter")$("go").click()};
$("out").onclick=function(){if(chan){db.removeChannel(chan);chan=null}db.auth.signOut().then(function(){show(false)})};

/* ---- tiempo real ---- */
function live(){
  if(chan)return;
  chan=db.channel("catalog").on("broadcast",{event:"changed"},function(){clearTimeout(tm);tm=setTimeout(load,250)})
   .subscribe(function(st){var l=$("live");l.classList.toggle("ok",st=="SUBSCRIBED");l.lastChild.textContent=st=="SUBSCRIBED"?"en vivo":"reconectando…"});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!$("vApp").hidden)load()});

function load(){
  db.from("products").select("*").order("sort",{ascending:true}).order("id",{ascending:true}).then(function(r){
    if(r.error){toast("No se pudo cargar: "+r.error.message);return}
    rows=r.data;draw();
  });
}
function cats(){var o=["Todas"];rows.forEach(function(x){if(o.indexOf(x.category)<0)o.push(x.category)});return o}
function view(){var t=norm(term);return rows.filter(function(x){return(fcat=="Todas"||x.category==fcat)&&(!t||norm(x.name).indexOf(t)>-1)})}
function draw(){
  var C=cats();if(C.indexOf(fcat)<0)fcat="Todas";
  $("chips").innerHTML=C.map(function(c){return '<button class="chip" aria-pressed="'+(c==fcat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
  $("s1").textContent=rows.length;$("s2").textContent=rows.filter(function(x){return x.active}).length;
  $("s3").textContent=rows.filter(function(x){return!x.active}).length;$("s4").textContent=rows.filter(function(x){return!x.image_url}).length;
  var L=view();
  $("list").innerHTML=L.map(function(x,i){
    var th=x.image_url?'<img class="th" src="'+esc(x.image_url)+'" alt="">':'<div class="th">'+esc(x.name.charAt(0))+'</div>';
    return '<div class="row'+(x.active?'':' off')+'"><button class="main" data-id="'+x.id+'">'+th+'<div class="n"><b>'+esc(x.name)+'</b><small>'+esc(x.category)+(x.active?'':' · oculto')+'</small><br><em>'+money(x.price)+'</em></div></button>'+
    '<div class="side"><button class="sw'+(x.active?' on':'')+'" data-t="'+x.id+'" role="switch" aria-checked="'+x.active+'" aria-label="Visible en el catálogo"></button>'+
    '<div class="mv"><button data-mv="-1" data-id="'+x.id+'" aria-label="Subir"'+(i==0?' disabled':'')+'>▲</button><button data-mv="1" data-id="'+x.id+'" aria-label="Bajar"'+(i==L.length-1?' disabled':'')+'>▼</button></div></div></div>'}).join("")
    ||'<p class="hint">'+(rows.length?"Nada coincide con la búsqueda.":"Aún no hay productos. Toca “Nuevo”.")+'</p>';
  $("cats").innerHTML=C.slice(1).map(function(c){return '<option value="'+esc(c)+'">'}).join("");
}
$("q").oninput=function(){term=this.value;draw()};
$("chips").onclick=function(e){var b=e.target.closest("[data-c]");if(b){fcat=b.dataset.c;draw()}};
function byId(id){return rows.filter(function(x){return x.id==id})[0]}
$("list").onclick=function(e){
  var t=e.target.closest("[data-t]");
  if(t){var x=byId(t.dataset.t);if(!x)return;x.active=!x.active;draw();
    db.from("products").update({active:x.active}).eq("id",x.id).then(function(r){if(r.error){toast("No se pudo cambiar");load()}});return}
  var m=e.target.closest("[data-mv]");
  if(m){move(byId(m.dataset.id),+m.dataset.mv);return}
  var b=e.target.closest(".main");if(b)edit(byId(b.dataset.id));
};
function move(x,d){
  var L=view(),i=L.indexOf(x),y=L[i+d];if(!y)return;
  var a=rows.indexOf(x),b=rows.indexOf(y);rows[a]=y;rows[b]=x;
  var ch=[];rows.forEach(function(r,k){if(r.sort!==k+1){r.sort=k+1;ch.push(r)}});
  draw();
  Promise.all(ch.map(function(r){return db.from("products").update({sort:r.sort}).eq("id",r.id)})).then(function(rs){
    if(rs.some(function(r){return r.error})){toast("No se pudo reordenar");load()}});
}
$("new").onclick=function(){edit(null)};

function setPrev(){
  var p=$("prev");
  if(newFile)p.outerHTML='<img id="prev" class="th" src="'+URL.createObjectURL(newFile)+'" alt="">';
  else if(imgUrl)p.outerHTML='<img id="prev" class="th" src="'+esc(imgUrl)+'" alt="">';
  else p.outerHTML='<div id="prev" class="th">+</div>';
}
function open_(on){$("sh").classList.toggle("on",on);$("veil").classList.toggle("on",on);document.body.style.overflow=on?"hidden":""}
function edit(x,dup){
  cur=dup?null:x;newFile=null;imgUrl=x?x.image_url:null;$("file").value="";$("ferr").textContent="";
  $("sht").textContent=dup?"Producto duplicado":x?"Editar producto":"Nuevo producto";
  $("fn").value=x?x.name+(dup?" (copia)":""):"";$("fp").value=x?x.price:"";$("fc").value=x?x.category:(fcat!="Todas"?fcat:"");
  $("fo").value=dup?(Math.max.apply(null,rows.map(function(r){return r.sort}))+1):x?x.sort:(rows.length?Math.max.apply(null,rows.map(function(r){return r.sort}))+1:1);
  $("fa").checked=x?x.active:true;$("del").style.display=cur?"":"none";$("dup").style.display=cur?"":"none";
  setPrev();open_(true);
}
$("dup").onclick=function(){if(cur)edit(cur,true)};
$("pickBtn").onclick=function(){$("file").click()};
document.addEventListener("click",function(e){if(e.target.id=="prev")$("file").click()});
$("file").onchange=function(){newFile=this.files[0]||null;setPrev()};
$("noImg").onclick=function(){newFile=null;imgUrl=null;$("file").value="";setPrev()};
$("cancel").onclick=$("veil").onclick=function(){open_(false)};

function resize(f){return new Promise(function(ok,no){
  var im=new Image();im.onload=function(){
    var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){b?ok(b):no()},"image/jpeg",.85)};
  im.onerror=no;im.src=URL.createObjectURL(f)})}
function cloudUpload(blob){return new Promise(function(ok,ko){
  var f=new FormData();f.append("file",blob);f.append("upload_preset",UPLOAD_PRESET);
  f.append("public_id","nokta_"+Date.now()+"_"+Math.random().toString(36).slice(2,6));f.append("tags","nokta");
  var x=new XMLHttpRequest();x.open("POST","https://api.cloudinary.com/v1_1/"+CLOUD_NAME+"/image/upload");
  x.upload.onprogress=function(e){if(e.lengthComputable)$("pb").firstChild.style.width=(e.loaded/e.total*100)+"%"};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(_){}
    x.status<300&&j.secure_url?ok(j.secure_url.replace("/upload/","/upload/f_auto,q_auto,w_700/")):ko(new Error((j.error&&j.error.message)||"no se pudo subir la foto"))};
  x.onerror=function(){ko(new Error("sin conexión"))};x.send(f)})}
$("save").onclick=function(){
  var n=$("fn").value.trim(),p=parseInt($("fp").value,10),c=$("fc").value.trim()||"Otros";
  if(!n||isNaN(p)||p<0){$("ferr").textContent="Pon un nombre y un precio válido.";return}
  $("save").disabled=true;$("save").textContent="Guardando…";$("ferr").textContent="";
  var up=Promise.resolve(imgUrl);
  if(newFile){$("pb").style.display="block";$("pb").firstChild.style.width="0";up=resize(newFile).then(cloudUpload)}
  up.then(function(url){
    var d={name:n,price:p,category:c,image_url:url||null,active:$("fa").checked,sort:parseInt($("fo").value,10)||0};
    return cur?db.from("products").update(d).eq("id",cur.id):db.from("products").insert(d)})
  .then(function(r){if(r.error)throw r.error;open_(false);toast("Guardado");load()})
  .catch(function(e){$("ferr").textContent="No se pudo guardar: "+(e.message||"error")})
  .then(function(){$("pb").style.display="none";$("save").disabled=false;$("save").textContent="Guardar"});
};
$("del").onclick=function(){
  if(!cur||!confirm("¿Eliminar “"+cur.name+"”? No se puede deshacer."))return;
  db.from("products").delete().eq("id",cur.id).then(function(r){
    if(r.error){$("ferr").textContent="No se pudo eliminar.";return}
    open_(false);toast("Eliminado");load()});
};
</script>
</body>
</html>
